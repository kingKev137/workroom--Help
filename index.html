<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Room Assistance</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 25px 18px;
    text-align: center;
    color: #222;
}

.container {
    max-width: 500px;
    margin: auto;
}

.alert {
    font-size: 50px;
    margin-bottom: 5px;
}

h1 {
    color: #d71920;
    font-size: 32px;
    margin: 5px 0 15px;
}

.message {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 8px;
}

.instruction {
    font-size: 17px;
    color: #555;
    margin-bottom: 25px;
}

.button {
    display: block;
    background: #25D366;
    color: white;
    text-decoration: none;
    border-radius: 15px;
    padding: 19px 18px;
    margin: 14px 0;
    font-size: 23px;
    font-weight: 700;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
}

.button span {
    display: block;
    font-size: 15px;
    font-weight: 400;
    margin-top: 3px;
}

.footer {
    margin-top: 28px;
    color: #777;
    font-size: 13px;
}
</style>
</head>

<body>
